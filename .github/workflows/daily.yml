name: Update daily reading

on:
  schedule:
    # 22:10 UTC = 次日 06:10（北京时间）
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-reading
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch articles
        run: node scripts/fetch-daily.mjs

      - name: Commit new articles
        run: |
          if [ -z "$(git status --porcelain data/daily)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "miffy-reads-bot"
          git config user.email "miffy-reads-bot@users.noreply.github.com"
          git add data/daily
          git commit -m "chore: daily reading $(TZ=Asia/Shanghai date +%F)"
          git push
